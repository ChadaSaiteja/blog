name: Validate Blog Post

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '_data/blog_style.yml'
      - '_layouts/**'
      - '_includes/**'
      - 'scripts/blog/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for diff checks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check the style config is valid
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts/blog")
          from quality import load_config
          from new_post import build_front_matter, build_body

          config = load_config()
          weights = config["rubric"]["weights"]
          assert sum(weights.values()) == 100, "rubric weights must total 100"
          assert config["rubric"]["gate"] > 0
          for key in ("tokens", "structure", "rubric"):
              assert key in config, "_data/blog_style.yml must define {}".format(key)
          # The scaffolding must run without raising.
          build_front_matter(
              {"layout": "post", "title": "t", "description": "d",
               "date": "2026-01-01", "categories": ["Backend"]},
              config,
          )
          build_body(config)
          print("style config ok")
          PY

      - name: Check templates only read config keys that exist
        run: |
          # A config key can be removed or commented out and every template will
          # still render, because Liquid resolves a missing key to nil and raises
          # nothing. That is how the author card came to render as an empty box.
          # This step is the same contract test as
          # tests/test_blog.py::test_templates_only_read_config_keys_that_exist
          # and names the file and the key, rather than a generic assertion.
          python - <<'PY'
          import os
          import re
          import sys
          sys.path.insert(0, "scripts/blog")
          from quality import load_config

          config = load_config()
          optional_roots = {"author_profile"}
          list_properties = {"size", "first", "last"}

          assign_re = re.compile(
              r"\{%-?\s*assign\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*"
              r"site\.data\.blog_style((?:\.[A-Za-z_][A-Za-z0-9_]*)*)\s*-?%\}"
          )
          direct_re = re.compile(
              r"site\.data\.blog_style((?:\.[A-Za-z_][A-Za-z0-9_]*)+)"
          )

          templates = []
          for base in ("_layouts", "_includes"):
              for name in sorted(os.listdir(base)):
                  if name.endswith((".html", ".md")):
                      templates.append(os.path.join(base, name))
          templates.append("index.html")

          def first_missing(segments):
              value = config
              for segment in segments:
                  if isinstance(value, (list, str)) and segment in list_properties:
                      continue
                  if isinstance(value, dict) and segment in value:
                      value = value[segment]
                  else:
                      return segment
              return None

          problems = []
          for relative in templates:
              with open(relative, encoding="utf-8") as handle:
                  source = handle.read()
              references = []
              for match in direct_re.finditer(source):
                  references.append([s for s in match.group(1).split(".") if s])
              for match in assign_re.finditer(source):
                  alias, prefix = match.group(1), match.group(2)
                  prefix_segments = [s for s in prefix.split(".") if s]
                  alias_re = re.compile(
                      r"\b" + re.escape(alias) + r"((?:\.[A-Za-z_][A-Za-z0-9_]*)+)"
                  )
                  for use in alias_re.finditer(source):
                      tail = [s for s in use.group(1).split(".") if s]
                      references.append(prefix_segments + tail)
              for segments in references:
                  if not segments or segments[0] in optional_roots:
                      continue
                  missing = first_missing(segments)
                  if missing:
                      problems.append(
                          "{} reads site.data.blog_style.{} but the config has no '{}'".format(
                              relative, ".".join(segments), missing)
                      )

          if problems:
              for problem in problems:
                  print("  " + problem)
              sys.exit("Templates read config keys that do not exist.")
          print("config contract ok")
          PY

      - name: Check layouts and includes still parse
        run: |
          python - <<'PY'
          import glob
          import sys
          sys.path.insert(0, "scripts/blog")
          from liquid_render import LiquidRenderer

          renderer = LiquidRenderer(".")
          for path in sorted(glob.glob("_layouts/*.html")) + sorted(glob.glob("_includes/*.html")):
              with open(path, encoding="utf-8") as handle:
                  source = handle.read()
              tokens = renderer._tokenize(source)
              nodes, _ = renderer._parse(tokens, 0, set())
              assert nodes is not None, path
          print("templates parse ok")
          PY

      - name: Check templates only use filters Liquid actually has
        run: |
          # A filter that renders under scripts/blog/liquid_render.py but does
          # not exist in Shopify Liquid fails silently on GitHub Pages. This
          # is the check that catches it. See tests/test_blog.py for the
          # same assertion plus the reasoning.
          python - <<'PY'
          import os
          import re
          import sys
          sys.path.insert(0, "scripts/blog")
          from liquid_render import ALLOWED_FILTERS

          filter_re = re.compile(r"\|\s*([a-z_][a-z0-9_]*)\s*:")
          loop_args = {"limit", "offset", "reversed", "cols"}
          found = {}
          for base in ("_layouts", "_includes"):
              for name in sorted(os.listdir(base)):
                  if not name.endswith((".html", ".md")):
                      continue
                  with open(os.path.join(base, name), encoding="utf-8") as handle:
                      source = re.sub(r"<[^>]*>", " ", handle.read())
                  for match in filter_re.findall(source):
                      found.setdefault(match, []).append(name)
          with open("index.html", encoding="utf-8") as handle:
              source = re.sub(r"<[^>]*>", " ", handle.read())
          for match in filter_re.findall(source):
              found.setdefault(match, []).append("index.html")

          offenders = {
              name: files for name, files in found.items()
              if name not in ALLOWED_FILTERS and name not in loop_args
          }
          if offenders:
              for name, files in sorted(offenders.items()):
                  print("  {} used in {}".format(name, ", ".join(files)))
              sys.exit("These filters are not in the standard Shopify Liquid set.")
          print("filter portability ok: {}".format(", ".join(sorted(found))))
          PY

      - name: Run Style Checks on New/Changed Posts
        run: |
          # Identify changed markdown files in _posts/
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD^...HEAD | grep '^_posts/.*\.md$' || true)
          else
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep '^_posts/.*\.md$' || true)
          fi
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed blog posts in _posts/ found."
            exit 0
          fi

          echo "Validating changed posts:"
          echo "$CHANGED_FILES"

          for file in $CHANGED_FILES; do
            echo "Checking: $file"
            python scripts/blog/validate_style.py "$file"
            python scripts/blog/quality.py "$file"
          done

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build Jekyll Site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
