name: Validate Blog Post

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for diff checks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quality Checks on New/Changed Posts
        run: |
          # Identify changed markdown files in _posts/
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep '^_posts/.*\.md$' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed blog posts in _posts/ found."
            exit 0
          fi
          
          echo "Validating changed posts:"
          echo "$CHANGED_FILES"
          
          # Run the quality checker on each changed file
          for file in $CHANGED_FILES; do
            echo "Checking: $file"
            python scripts/blog/quality.py "$file" 80
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build Jekyll Site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
